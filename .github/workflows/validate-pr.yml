name: Validate PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
        env:
          SITE_URL: https://hilt21.github.io
          PUBLIC_BASE_PATH: /aboutMe/
