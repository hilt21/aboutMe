name: Refresh data and deploy Pages
on:
  schedule:
    - cron: '17 0 * * 1'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: aboutme-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      calendar_outcome: ${{ steps.calendar.outcome }}
      projects_outcome: ${{ steps.projects.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh public contributions
        id: calendar
        continue-on-error: true
        run: npm run sync
      - name: Refresh selected repository metadata
        id: projects
        continue-on-error: true
        run: node scripts/sync-projects.mjs
      - run: npm run check && npm test
      - name: Commit refreshed snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/github.json src/data/projects.json
          git diff --cached --quiet || git commit -m 'data: refresh contributions and selected projects'
          git push
      - run: npm run build
        env:
          PUBLIC_BASE_PATH: /aboutMe/
          SITE_URL: https://hilt21.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  report:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report collection or deployment failures
        if: needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.build.outputs.calendar_outcome == 'failure' || needs.build.outputs.projects_outcome == 'failure'
        run: exit 1
